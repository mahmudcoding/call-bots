<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Bots</title>
<style>
  :root {
    --bg: #08090b; --panel: #0e1015; --card: #13161c; --card-2: #1b1f27;
    --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.14);
    --text: #f2f4f8; --muted: #8b93a3; --faint: #5a6172;
    --accent: #6d5efc; --accent-2: #8b7cff; --accent-soft: rgba(109,94,252,.16);
    --glow: 0 0 0 1px rgba(109,94,252,.35), 0 8px 24px -6px rgba(109,94,252,.45);
    --ok: #22d3a5; --warn: #ffb224; --danger: #ff5c5c;
    --r: 14px; --r-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  /* App shell: the window never scrolls, only the content area does. */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    display: flex; flex-direction: column;
    background:
      radial-gradient(1100px 620px at 88% -12%, rgba(109,94,252,.16), transparent 62%),
      radial-gradient(760px 520px at 2% 108%, rgba(34,211,165,.07), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input { font: inherit; color: inherit; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* ---------- header ---------- */
  header {
    flex: none; display: flex; align-items: center; gap: 14px;
    padding: 0 22px; height: 60px;
    background: rgba(8,9,11,.72); backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 15px; letter-spacing: -.2px; }
  .brand .dot {
    width: 24px; height: 24px; border-radius: 8px;
    background: linear-gradient(140deg, #8b7cff, #6d5efc 45%, #22d3a5);
    box-shadow: 0 0 18px -2px rgba(109,94,252,.75);
  }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--card-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap;
  }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .pill.-joining::before, .pill.-stopping::before, .pill.-leaving::before
    { background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
  .pill.-running::before, .pill.-in-call::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .pill.-error::before { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .35; } }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
    border-radius: var(--r-sm); background: var(--card-2); border: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted); white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 34px; padding: 0 14px; border-radius: var(--r-sm);
    background: var(--card-2); border: 1px solid var(--line-2);
    font-weight: 600; font-size: 13px; transition: all .15s ease;
  }
  .btn:hover { background: #202636; border-color: rgba(255,255,255,.22); }
  .btn.-accent {
    background: linear-gradient(135deg, #7d6dff, #6d5efc 55%, #5b4bf0);
    border-color: transparent; color: #fff; box-shadow: var(--glow);
  }
  .btn.-accent:hover { background: linear-gradient(135deg, #8f81ff, #7a6bff); }
  .btn.-danger { color: var(--danger); }
  .btn.-danger:hover { background: rgba(255,92,92,.12); border-color: rgba(255,92,92,.4); }
  .btn:disabled { opacity: .45; pointer-events: none; }

  main { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 22px 20px 32px; }
  .wrap { max-width: 1240px; margin: 0 auto; }

  /* ---------- control bar (always visible) ---------- */
  .bar {
    display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 60%), var(--panel);
    border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 20px;
  }
  .bar .grow { flex: 1 1 380px; min-width: 260px; }
  .lbl {
    display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700;
    color: var(--muted); margin-bottom: 9px; letter-spacing: .9px; text-transform: uppercase;
  }
  .bar input[type=text], .bar input[type=number] {
    width: 100%; height: 42px; padding: 0 14px; border-radius: var(--r-sm);
    background: var(--card); border: 1px solid var(--line-2); outline: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    transition: border-color .15s, box-shadow .15s;
  }
  .bar input::placeholder { color: var(--faint); }
  .bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .bar input:disabled { opacity: .6; }
  .bar .bot-label { width: 170px; flex: none; }
  .bar .count { width: 110px; flex: none; }
  .bar .devices { flex: none; }
  .toggles { display: flex; gap: 8px; }
  .tgl {
    height: 42px; min-width: 104px; padding: 0 14px; border-radius: var(--r-sm);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line-2); color: var(--muted);
    font-weight: 600; font-size: 13px; transition: all .15s ease;
  }
  .tgl:hover { border-color: rgba(255,255,255,.22); }
  .tgl .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .tgl.-on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  .tgl.-on .pip { background: var(--ok); }
  .tgl:disabled { opacity: .6; }
  .bar .go { height: 42px; padding: 0 22px; font-size: 14px; }

  .allbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .allbar .lead { font-size: 12px; font-weight: 650; color: var(--faint); text-transform: uppercase; letter-spacing: .4px; }
  .allbar .btn { height: 30px; padding: 0 11px; font-size: 12.5px; }

  /* ---------- one group per send ---------- */
  .batch { margin-bottom: 22px; }
  .bhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bhead .nm {
    font-size: 11px; font-weight: 700; letter-spacing: .9px;
    text-transform: uppercase; color: var(--muted);
  }
  .bhead .sub { font-size: 12px; color: var(--faint); }
  .bhead .btn { height: 28px; padding: 0 10px; font-size: 12px; }

  .empty {
    display: grid; place-items: center; gap: 10px; padding: 60px 20px; text-align: center;
    border: 1px dashed var(--line-2); border-radius: var(--r); color: var(--muted);
  }
  .empty b { color: var(--text); font-size: 15px; font-weight: 650; }

  /* ---------- bot cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    overflow: hidden; position: relative; transition: border-color .18s, transform .18s;
  }
  .card:hover { border-color: var(--line-2); transform: translateY(-2px); }
  .card .strip { height: 3px; }
  .thumb { position: relative; aspect-ratio: 16/9; background: #0d1016; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .skeleton {
    position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 12px;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.05) 50%, transparent 70%) #0d1016;
    background-size: 220% 100%; animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer { to { background-position: -120% 0; } }
  .thumb .pill { position: absolute; left: 10px; bottom: 10px; background: rgba(10,12,17,.78); backdrop-filter: blur(6px); }
  .cbody { padding: 12px 14px 14px; }
  .who { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ava { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; flex: none; }
  .who .nm { font-weight: 650; font-size: 14px; }
  .who .sub { color: var(--faint); font-size: 11.5px; }
  .controls { display: flex; align-items: center; gap: 6px; }
  .ibtn {
    width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--r-sm);
    border: 1px solid var(--line); background: var(--card-2); color: var(--muted);
    transition: all .13s; position: relative;
  }
  .ibtn:hover { color: var(--text); border-color: var(--line-2); background: #202636; }
  .ibtn.-off { color: var(--danger); border-color: rgba(255,92,92,.4); background: rgba(255,92,92,.10); }
  .ibtn.-live { color: var(--accent-2); border-color: rgba(109,94,252,.5); background: var(--accent-soft); }
  .ibtn.-req { color: var(--warn); border-color: rgba(255,178,36,.4); background: rgba(255,178,36,.08); }
  .ibtn:disabled { opacity: .35; pointer-events: none; }
  .ibtn.busy { pointer-events: none; }
  .ibtn.busy svg { opacity: 0; }
  .ibtn.busy::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.2); border-top-color: var(--text);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .controls .gap { flex: 1; }
  .err { margin-top: 10px; color: var(--danger); font-size: 12px; display: none; }
  .card.has-error .err { display: block; }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; top: 70px; right: 18px; z-index: 40; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    display: flex; align-items: center; gap: 9px; background: var(--card-2);
    border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 14px;
    font-size: 13px; max-width: 380px; animation: slidein .18s ease;
  }
  .toast.-ok { border-color: rgba(34,211,165,.5); }
  .toast.-err { border-color: rgba(255,92,92,.5); }
  .toast.-warn { border-color: rgba(255,178,36,.5); }
  @keyframes slidein { from { transform: translateX(12px); opacity: 0; } }

  #connBanner {
    display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: var(--danger); color: #16060a; font-weight: 700; font-size: 12.5px;
    text-align: center; padding: 4px;
  }
  body.disconnected #connBanner { display: block; }
</style>
</head>
<body>
<div id="connBanner">disconnected — retrying…</div>

<header>
  <div class="brand"><div class="dot"></div>Call Bots</div>
  <span id="statusPill" class="pill">idle</span>
  <div class="spacer"></div>
  <button id="stopBtn" class="btn -danger" hidden>Stop</button>
</header>

<main>
  <div class="wrap">
    <div class="bar">
      <div class="grow">
        <div class="lbl">Invite link</div>
        <input type="text" id="link" placeholder="paste invite link" spellcheck="false">
      </div>
      <div class="bot-label">
        <div class="lbl">Label</div>
        <input type="text" id="botLabel" maxlength="40" spellcheck="false">
      </div>
      <div class="count">
        <div class="lbl">Bots</div>
        <input type="number" id="count" min="1" max="50" value="2">
      </div>
      <div class="devices">
        <div class="lbl">Join with</div>
        <div class="toggles">
          <button type="button" id="camToggle" class="tgl -on" aria-pressed="true">
            <span class="pip"></span><span>Camera on</span></button>
          <button type="button" id="micToggle" class="tgl -on" aria-pressed="true">
            <span class="pip"></span><span>Mic on</span></button>
        </div>
      </div>
      <button id="goBtn" class="btn -accent go">Send bots</button>
    </div>

    <div class="allbar" id="allbar" hidden>
      <span class="lead">All bots</span>
      <button class="btn" data-all="unmute">Unmute</button>
      <button class="btn" data-all="mute">Mute</button>
      <button class="btn" data-all="cam-on">Cameras on</button>
      <button class="btn" data-all="cam-off">Cameras off</button>
      <button class="btn" data-all="share-on">Share screens</button>
      <button class="btn" data-all="share-off">Stop sharing</button>
    </div>

    <div class="empty" id="empty">
      <b id="emptyTitle">No bots in a call yet</b>
      <span id="emptyText">Paste the invite link, choose how many bots, and send them in.</span>
    </div>

    <div id="cards"></div>
  </div>
</main>

<div id="toasts"></div>

<script>
'use strict'
const svg = (body) =>
  `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ` +
  `stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`

const I = {
  mic: svg('<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>'),
  micOff: svg('<line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/>'),
  cam: svg('<path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>'),
  camOff: svg('<path d="M10.66 6H14a2 2 0 0 1 2 2v2.5l5.248-3.062A.5.5 0 0 1 22 7.87v8.196"/><path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2"/><path d="m2 2 20 20"/>'),
  share: svg('<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>'),
  leave: svg('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>'),
}

const $ = (sel, root = document) => root.querySelector(sel)
const el = (tag, cls, html) => {
  const node = document.createElement(tag)
  if (cls) node.className = cls
  if (html !== undefined) node.innerHTML = html
  return node
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/gu, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const toast = (msg, kind = '') => {
  const node = el('div', `toast ${kind}`, esc(msg))
  $('#toasts').append(node)
  setTimeout(() => { node.style.opacity = '0'; node.style.transition = 'opacity .3s'; setTimeout(() => node.remove(), 350) }, 4500)
}
const post = async (url, body) => {
  const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body ?? {}) })
  const data = await res.json().catch(() => ({}))
  if (!res.ok || data.ok === false) throw new Error(data.error ?? `HTTP ${res.status}`)
  return data
}

const S = { state: null, cards: new Map(), groups: new Map(), errorShown: null, camOn: true, micOn: true }

/* ---------- saved label ---------- */
const LABEL_STORAGE_KEY = 'call-bots-label'
const botLabelInput = $('#botLabel')
try { botLabelInput.value = localStorage.getItem(LABEL_STORAGE_KEY) ?? '' }
catch { /* storage can be unavailable in a restricted browser */ }
botLabelInput.oninput = () => {
  try { localStorage.setItem(LABEL_STORAGE_KEY, botLabelInput.value) }
  catch { /* keep the input usable even when storage is unavailable */ }
}

/* ---------- what bots join with ---------- */
// Only the state they arrive in — every bot still carries its clip and voice,
// so a camera turned on from its card afterwards publishes real footage.
const devices = [
  { key: 'camOn', el: '#camToggle', name: 'Camera' },
  { key: 'micOn', el: '#micToggle', name: 'Mic' },
]
for (const device of devices) {
  $(device.el).onclick = () => {
    S[device.key] = !S[device.key]
    const button = $(device.el)
    button.classList.toggle('-on', S[device.key])
    button.setAttribute('aria-pressed', String(S[device.key]))
    button.lastElementChild.textContent = `${device.name} ${S[device.key] ? 'on' : 'off'}`
  }
}

/* ---------- send bots (starts the session, or adds to it) ---------- */
$('#goBtn').onclick = async () => {
  const btn = $('#goBtn')
  const guests = Math.max(1, Number($('#count').value) || 1)
  const botLabel = $('#botLabel').value.trim()
  const running = S.state?.status === 'running'
  const buttonLabel = btn.textContent
  btn.disabled = true
  btn.textContent = 'Sending…'
  try {
    if (running) {
      const res = await post('/api/add', {
        guests, label: botLabel, camera: S.camOn, mic: S.micOn,
      })
      if (res.removed) toast('that batch was removed while it was still arriving', '-warn')
      else toast(`${res.added} bot(s) joined${res.failed ? `, ${res.failed} failed` : ''}`, res.failed ? '-warn' : '-ok')
    } else {
      await post('/api/start', {
        link: $('#link').value.trim(), guests, label: botLabel,
        camera: S.camOn, mic: S.micOn,
      })
    }
  } catch (error) {
    toast(error.message, '-err')
  } finally {
    btn.disabled = false
    btn.textContent = buttonLabel
  }
}
$('#link').onkeydown = (event) => { if (event.key === 'Enter') $('#goBtn').click() }

/* ---------- stop ---------- */
$('#stopBtn').onclick = async () => {
  const btn = $('#stopBtn')
  btn.disabled = true
  try {
    await post('/api/stop')
  } catch (error) {
    toast(error.message, '-err')
  } finally {
    btn.disabled = false
  }
}

for (const btn of document.querySelectorAll('[data-all]')) {
  btn.onclick = async () => {
    btn.disabled = true
    try { await post('/api/action', { slug: 'all', action: btn.dataset.all }) }
    catch (error) { toast(error.message, '-err') }
    finally { btn.disabled = false }
  }
}

/* ---------- batches: the bots of one send, shown and removed together ---------- */
const clock = (at) =>
  new Date(at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })

const removeBatch = async (id, btn) => {
  btn.dataset.busy = '1'
  btn.disabled = true
  const label = btn.textContent
  btn.textContent = 'Removing…'
  try {
    await post('/api/action', { slug: `batch:${id}`, action: 'leave' })
  } catch (error) {
    toast(error.message, '-err')
  } finally {
    delete btn.dataset.busy
    btn.disabled = false
    btn.textContent = label
  }
}

const buildGroup = (batch) => {
  const group = el('div', 'batch')
  group.dataset.batch = batch.id
  group.innerHTML = `
    <div class="bhead">
      <span class="nm">Batch ${esc(batch.id)}</span>
      <span class="sub"></span>
      <span class="spacer"></span>
      <button class="btn -danger" data-batch-remove
        title="Remove every bot that came in with this batch">Remove batch</button>
    </div>
    <div class="grid"></div>`
  $('[data-batch-remove]', group).onclick = (event) => removeBatch(batch.id, event.currentTarget)
  return group
}

/* ---------- bot cards ---------- */
const buildCard = (guest) => {
  const card = el('div', 'card')
  card.dataset.slug = guest.slug
  card.innerHTML = `
    <div class="strip" style="background:${esc(guest.color)}"></div>
    <div class="thumb">
      <div class="skeleton">connecting…</div>
      <img alt="" draggable="false" style="display:none">
      <span class="pill">–</span>
    </div>
    <div class="cbody">
      <div class="who">
        <div class="ava" style="background:${esc(guest.color)}">${esc(guest.label.replace(/\D/gu, '') || 'G')}</div>
        <div style="min-width:0">
          <div class="nm">${esc(guest.label)}</div>
        </div>
      </div>
      <div class="controls">
        <button class="ibtn" data-act="mic" title="Toggle microphone">${I.mic}</button>
        <button class="ibtn" data-act="cam" title="Toggle camera">${I.cam}</button>
        <button class="ibtn" data-act="share" title="Share a screen">${I.share}</button>
        <span class="gap"></span>
        <button class="ibtn" data-act="leave" title="Remove this bot">${I.leave}</button>
      </div>
      <div class="err"></div>
    </div>`
  for (const btn of card.querySelectorAll('[data-act]')) {
    btn.onclick = () => cardAction(guest.slug, btn.dataset.act, btn)
  }
  return card
}

const cardAction = async (slug, act, btn) => {
  const guest = (S.state?.session?.guests ?? []).find((g) => g.slug === slug)
  if (!guest) return
  let action = act
  if (act === 'mic') action = guest.mic === 'off' ? 'unmute' : 'mute'
  if (act === 'cam') action = guest.cam === 'off' ? 'cam-on' : 'cam-off'
  if (act === 'share') action = guest.screen === 'on' ? 'share-off' : 'share-on'
  btn.classList.add('busy')
  try {
    const { results } = await post('/api/action', { slug, action })
    const result = results[guest.label]
    if (result === 'request') toast(`${guest.label}: the host restricted this device`, '-warn')
    if (result === 'blocked') toast('This call blocks screen sharing — set Meeting settings, Screen share to Allowed. If it was On request, send the bots again.', '-warn')
  } catch (error) {
    toast(`${guest.label}: ${error.message}`, '-err')
  } finally {
    btn.classList.remove('busy')
  }
}

const STATE_LABEL = {
  created: 'queued', ready: 'left', joining: 'joining',
  'in-call': 'in call', leaving: 'leaving', closed: 'closed',
}
const updateCard = (guest, grid) => {
  let card = S.cards.get(guest.slug)
  if (!card) {
    card = buildCard(guest)
    S.cards.set(guest.slug, card)
    grid.append(card)
  }
  const failed = guest.state.startsWith('error')
  const base = failed ? 'error' : guest.state
  const pill = $('.thumb .pill', card)
  pill.textContent = failed ? 'error' : (STATE_LABEL[base] ?? base)
  pill.className = `pill -${base}`
  card.classList.toggle('has-error', Boolean(guest.lastError) && failed)
  $('.err', card).textContent = guest.lastError ?? ''

  const inCall = guest.state === 'in-call'
  const mic = $('[data-act=mic]', card)
  mic.innerHTML = guest.mic === 'off' ? I.micOff : I.mic
  mic.className = `ibtn${guest.mic === 'off' ? ' -off' : ''}${guest.mic === 'request' ? ' -req' : ''}${mic.classList.contains('busy') ? ' busy' : ''}`
  mic.disabled = !inCall

  const cam = $('[data-act=cam]', card)
  cam.innerHTML = guest.cam === 'off' ? I.camOff : I.cam
  cam.className = `ibtn${guest.cam === 'off' ? ' -off' : ''}${guest.cam === 'request' ? ' -req' : ''}${cam.classList.contains('busy') ? ' busy' : ''}`
  cam.disabled = !inCall

  const share = $('[data-act=share]', card)
  share.className = `ibtn${guest.screen === 'on' ? ' -live' : ''}${guest.screen === 'blocked' ? ' -off' : ''}${share.classList.contains('busy') ? ' busy' : ''}`
  share.title = guest.screen === 'blocked'
    ? 'This call blocks screen sharing — set Meeting settings, Screen share to Allowed. If it was On request, send the bots again: the call does not lift that one for anyone already in it.'
    : 'Share a screen'
  share.disabled = !inCall || guest.screen === 'blocked'

  $('[data-act=leave]', card).disabled = ['created', 'closed'].includes(guest.state)
}

/* ---------- thumbnails ---------- */
const refreshThumbs = () => {
  const guests = S.state?.session?.guests ?? []
  guests.forEach((guest, i) => {
    if (['created', 'closed'].includes(guest.state)) return
    const card = S.cards.get(guest.slug)
    if (!card) return
    setTimeout(() => {
      const img = $('.thumb img', card)
      const probe = new Image()
      probe.onload = () => {
        img.src = probe.src
        img.style.display = 'block'
        $('.thumb .skeleton', card).style.display = 'none'
      }
      probe.src = `/api/thumb/${encodeURIComponent(guest.slug)}?t=${Date.now()}`
    }, i * 250)
  })
}

/* ---------- render ---------- */
const render = (state) => {
  S.state = state
  const running = state.status === 'running'
  const joining = state.status === 'joining'
  const busy = joining || state.status === 'stopping'

  const pill = $('#statusPill')
  pill.textContent = state.status
  pill.className = `pill -${state.status}`

  // A session mid-join is already a session to stop: one bot stuck in an
  // admission lobby holds "joining" for up to ten minutes, and hiding Stop for
  // all of it leaves the window with no way out.
  $('#stopBtn').hidden = !running && !joining
  $('#allbar').hidden = !running
  $('#goBtn').textContent = running ? 'Add bots' : 'Send bots'
  $('#goBtn').disabled = busy
  // the link belongs to the live call, so it is fixed for the session
  $('#link').disabled = running || busy
  if (running && state.session?.inviteLink) $('#link').value = state.session.inviteLink

  if (state.lastError && state.lastError !== S.errorShown) {
    S.errorShown = state.lastError
    toast(state.lastError, '-err')
  }
  if (!state.lastError) S.errorShown = null

  // the browser is fetched once on first run; say so instead of failing later
  if (state.browserInstalling) {
    $('#emptyTitle').textContent = 'Getting the browser ready'
    $('#emptyText').textContent = state.browserProgress
      ? `Downloading Chromium — ${state.browserProgress}. Bots can join as soon as it lands.`
      : 'Downloading Chromium (one-time, about 175 MB). Bots can join as soon as it lands.'
    $('#goBtn').disabled = true
  } else if (!state.browserReady) {
    $('#emptyTitle').textContent = 'No browser available'
    $('#emptyText').textContent = 'Install Google Chrome, or run: npx playwright install chromium'
  } else {
    $('#emptyTitle').textContent = 'No bots in a call yet'
    $('#emptyText').textContent = 'Paste the invite link, choose how many bots, and send them in.'
  }

  const guests = state.session?.guests ?? []
  const batches = state.session?.batches ?? []
  $('#empty').hidden = guests.length > 0
  for (const batch of batches) {
    let group = S.groups.get(batch.id)
    if (!group) {
      group = buildGroup(batch)
      S.groups.set(batch.id, group)
      // Batch ids only ever grow, so appending keeps the groups in the order
      // they were sent — and leaves the ones already on screen where they are.
      $('#cards').append(group)
    }
    const mine = guests.filter((guest) => guest.batch === batch.id)
    $('.bhead .sub', group).textContent =
      `${mine.length} bot${mine.length === 1 ? '' : 's'} · sent ${clock(batch.at)}`
    // Removing a batch takes as long as closing its browsers; a snapshot
    // arriving meanwhile must not hand the button back mid-request.
    const remove = $('[data-batch-remove]', group)
    if (!remove.dataset.busy) remove.disabled = !running
    for (const guest of mine) updateCard(guest, $('.grid', group))
  }
  for (const [id, group] of S.groups) {
    if (!batches.some((batch) => batch.id === id)) {
      group.remove()
      S.groups.delete(id)
    }
  }
  for (const [slug, card] of S.cards) {
    if (!guests.some((guest) => guest.slug === slug)) {
      card.remove()
      S.cards.delete(slug)
    }
  }
}

/* ---------- live updates ---------- */
const connect = () => {
  const es = new EventSource('/api/events')
  es.onopen = () => document.body.classList.remove('disconnected')
  es.onerror = () => document.body.classList.add('disconnected')
  es.onmessage = (event) => {
    const msg = JSON.parse(event.data)
    if (msg.type === 'state') render(msg.state)
  }
}
connect()
setInterval(refreshThumbs, 3000)
</script>
</body>
</html>
